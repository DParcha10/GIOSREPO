[pytest]
testpaths = tests
norecursedirs = GIOSREPO .git gios-react node_modules .agents-state
pythonpath = .
filterwarnings =
    ignore::DeprecationWarning:starlette.*
    ignore::DeprecationWarning:anyio.*
    ignore:.*Support for class-based `config` is deprecated.*:DeprecationWarning
    ignore:.*PydanticDeprecatedSince20.*
